# 依赖跟版：GitHub Actions 与 npm 合成同一条月度 PR，在远端点一次合并。
# Dependabot 一个条目只管一个生态，跨生态合并靠顶层的 multi-ecosystem-groups。
version: 2

multi-ecosystem-groups:
  # 组名进分支名，必须是 ASCII。周期定在组上，进了组的条目不再各自写 schedule
  toolchain:
    schedule:
      interval: monthly

updates:
  # patterns 是进组的必填项，'*' 表示这个生态的全部依赖
  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: toolchain
    patterns: ['*']

  - package-ecosystem: npm
    directory: /
    multi-ecosystem-group: toolchain
    patterns: ['*']
